name: Update astronomy data and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          test -f FATYAK-Website.zip
          unzip -q FATYAK-Website.zip -d website
          test -f website/source/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh data and build
        working-directory: website/source
        run: |
          npm ci --no-audit --no-fund
          npm run update-data
          npm test
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/source/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
